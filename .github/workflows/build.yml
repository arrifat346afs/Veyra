name: Build Linux

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Linux x86_64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read package version
        id: metadata
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libglib2.0-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binary
        run: cargo build --release --locked --jobs 2

      - name: Package application
        run: |
          mkdir -p dist/veyra-linux-x86_64
          install -m755 target/release/veyra dist/veyra-linux-x86_64/veyra
          cp README.md dist/veyra-linux-x86_64/
          cp -r integration scripts dist/veyra-linux-x86_64/
          cp -r icons dist/veyra-linux-x86_64/
          tar -czf dist/veyra-linux-x86_64.tar.gz -C dist veyra-linux-x86_64
          cd dist
          sha256sum veyra-linux-x86_64.tar.gz > veyra-linux-x86_64.tar.gz.sha256

      - name: Package AppImage
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p tools
          wget -q -O tools/linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          install -m755 target/release/veyra AppDir/usr/bin/veyra
          APPIMAGE_EXTRACT_AND_RUN=1 ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/veyra \
            --desktop-file integration/veyra.desktop \
            --icon-file icons/hicolor/512x512/apps/veyra.png \
            --output appimage
          mv ./*.AppImage "dist/Veyra-${version}-x86_64.AppImage"
          cd dist
          sha256sum "Veyra-${version}-x86_64.AppImage" > Veyra-${version}-x86_64.AppImage.sha256

      - name: Upload application
        uses: actions/upload-artifact@v6
        with:
          name: veyra-linux-x86_64
          path: |
            dist/veyra-linux-x86_64.tar.gz
            dist/veyra-linux-x86_64.tar.gz.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build package in Arch Linux
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD
          docker run --rm \
            -v "$PWD:/src" -w /src \
            archlinux:base-devel \
            bash -lc 'set -e; pacman -Syu --noconfirm --needed rust cargo clang cmake pkgconf glib2 gcc-libs glibc mesa wayland libxkbcommon libxkbcommon-x11 libx11 libxcb fontconfig freetype2; useradd -m builder; cp -a /src /tmp/build; chown -R builder:builder /tmp/build; su builder -c "cd /tmp/build && makepkg --noconfirm --nodeps"; cp /tmp/build/*.pkg.tar.zst /src/'
          sha256sum ./*.pkg.tar.zst > veyra-arch-x86_64.pkg.tar.zst.sha256

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: veyra-arch-x86_64
          path: |
            ./*.pkg.tar.zst
            veyra-arch-x86_64.pkg.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [build, arch-package]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download application
        uses: actions/download-artifact@v7
        with:
          name: veyra-linux-x86_64
          path: dist

      - name: Download Arch package
        uses: actions/download-artifact@v7
        with:
          name: veyra-arch-x86_64
          path: dist

      - name: Verify archive checksum
        working-directory: dist
        run: |
          sha256sum -c veyra-linux-x86_64.tar.gz.sha256
          sha256sum -c *.AppImage.sha256
          sha256sum -c veyra-arch-x86_64.pkg.tar.zst.sha256

      - name: Create release or update assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/veyra-linux-x86_64.tar.gz \
              dist/veyra-linux-x86_64.tar.gz.sha256 \
              dist/*.AppImage \
              dist/*.AppImage.sha256 \
              dist/*.pkg.tar.zst \
              dist/veyra-arch-x86_64.pkg.tar.zst.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/veyra-linux-x86_64.tar.gz \
              dist/veyra-linux-x86_64.tar.gz.sha256 \
              dist/*.AppImage \
              dist/*.AppImage.sha256 \
              dist/*.pkg.tar.zst \
              dist/veyra-arch-x86_64.pkg.tar.zst.sha256 \
              --target "$RELEASE_COMMIT" --generate-notes --title "Veyra $RELEASE_TAG"
          fi
