[package]
name = "veyra"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9.1"
gpui-kit-assets = "0.9.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-lock = "3"
mime_guess = "2"
shell-words = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
