[package]
name = "veyra"
version = "0.1.2"
edition = "2024"

[dependencies]
gpui-kit = "0.9.1"
gpui-kit-assets = "0.9.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
shell-words = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
futures-channel = "0.3"

libc = "0.2"
zbus = "5.19"
async-process = "2"
async-channel = "2"
futures-lite = "2"
globset = "0.4"
gio = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
tempfile = "3"
